# Mantém as actions fixadas por SHA atualizadas: o Dependabot abre PR quando sai versão nova.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Espera 7 dias antes de propor uma versão recém-publicada (tempo para versões maliciosas serem descobertas).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
