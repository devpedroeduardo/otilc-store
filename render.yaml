# Blueprint do Render (spec-016): a API da OTILC. Referência: https://render.com/docs/blueprint-spec
# Nenhum valor secreto aqui. As variáveis com `sync: false` o Pedro preenche no painel; o Render só
# pede esses valores na criação do Blueprint (depois, mudanças são feitas direto no painel).
# O plano pago é escolhido no painel. Sem `plan`, o Render cria com 0.5c-512mb (pago, com
# Pre-Deploy Command); o plano free não roda o Pre-Deploy.
services:
  - type: web
    name: otilc-api
    runtime: docker
    region: virginia
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Uma instância, sem autoscaling (sem bloco `scaling`).
    numInstances: 1
    healthCheckPath: /api/health
    # Deploy automático no merge da main, só depois do CI verde.
    autoDeployTrigger: checksPass
    # Migrations uma vez por deploy, antes de subir a versão nova. Se falhar, o deploy é cancelado
    # e a versão anterior continua no ar. Caminho absoluto: roda numa instância separada da imagem.
    preDeployCommand: node /repo/apps/api/dist/db/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      # Session pooler do Supabase (porta 5432 do pooler).
      - key: DATABASE_URL
        sync: false
      # Certificado raiz público do Supabase (PEM), para o SSL com verificação.
      - key: DATABASE_CA_CERT
        sync: false
      # URL da loja na Vercel: só a origem, com https e sem barra no fim.
      - key: WEB_ORIGIN
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_NOTIFICATION_URL
        sync: false
